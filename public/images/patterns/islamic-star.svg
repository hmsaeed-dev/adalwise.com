<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .line {
        stroke: #dfc27d;
        stroke-width: 0.85;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Central 8-Point Star (Rub el Hizb geometric lattice) -->
  <!-- Square 1 (Center) -->
  <rect x="26" y="26" width="28" height="28" class="line" />
  <!-- Square 2 (Rotated 45 deg) -->
  <rect x="26" y="26" width="28" height="28" transform="rotate(45 40 40)" class="line" />

  <!-- Corner 8-point stars (tiling at 0,0 / 80,0 / 0,80 / 80,80) -->
  <rect x="-14" y="-14" width="28" height="28" class="line" />
  <rect x="-14" y="-14" width="28" height="28" transform="rotate(45 0 0)" class="line" />

  <rect x="66" y="-14" width="28" height="28" class="line" />
  <rect x="66" y="-14" width="28" height="28" transform="rotate(45 80 0)" class="line" />

  <rect x="-14" y="66" width="28" height="28" class="line" />
  <rect x="-14" y="66" width="28" height="28" transform="rotate(45 0 80)" class="line" />

  <rect x="66" y="66" width="28" height="28" class="line" />
  <rect x="66" y="66" width="28" height="28" transform="rotate(45 80 80)" class="line" />

  <!-- Connecting Interlaced Lattice Lines -->
  <line x1="40" y1="0" x2="40" y2="20" class="line" />
  <line x1="40" y1="60" x2="40" y2="80" class="line" />
  <line x1="0" y1="40" x2="20" y2="40" class="line" />
  <line x1="60" y1="40" x2="80" y2="40" class="line" />

  <line x1="0" y1="20" x2="20" y2="0" class="line" />
  <line x1="60" y1="0" x2="80" y2="20" class="line" />
  <line x1="0" y1="60" x2="20" y2="80" class="line" />
  <line x1="60" y1="80" x2="80" y2="60" class="line" />

  <!-- Midpoint secondary diamond rosettes -->
  <polygon points="40,20 48,28 40,36 32,28" class="line" />
  <polygon points="40,44 48,52 40,60 32,52" class="line" />
  <polygon points="20,40 28,48 20,56 12,48" class="line" />
  <polygon points="60,40 68,48 60,56 52,48" class="line" />
</svg>
