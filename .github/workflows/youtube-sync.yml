name: Automated YouTube Catalog Sync

on:
  schedule:
    # Runs at 12:00 AM PKT (19:00 UTC) every single day
    - cron: '0 19 * * *'
  # Enables manual one-click trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run YouTube Sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: npm run sync:youtube

      - name: Audit catalogue integrity
        run: npm run audit:catalog

      - name: Commit and push updated catalogue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/lib/lectures/catalog.json content/catalog/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): automated daily youtube sync [skip ci]"
            git push origin main
          else
            echo "Catalogue is up to date. No new lectures found."
          fi
